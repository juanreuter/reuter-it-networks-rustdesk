name: Build Reuter Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  SCITER_RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  INSTALLER_NAME: "ReuterITNetworks-install.exe"
  PORTABLE_NAME: "ReuterITNetworks-portable-test.exe"
  ENABLE_HWCODEC: "false"

permissions:
  contents: write

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-installer:
    name: Windows x64 installer
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with RustDesk custom Flutter engine
        shell: powershell
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $enginePath = Join-Path $env:FLUTTER_ROOT "bin\cache\artifacts\engine\windows-x64-release"
          New-Item -ItemType Directory -Force -Path $enginePath
          Move-Item -Force windows-x64-release\* $enginePath

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-reuter

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if [ "$ENABLE_HWCODEC" = "true" ]; then
            vcpkg_args=(install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed")
          else
            vcpkg_args=(install opus libyuv libvpx aom --classic --overlay-ports=./res/vcpkg --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed")
          fi

          if ! "$VCPKG_ROOT/vcpkg" "${vcpkg_args[@]}"; then
            find "$VCPKG_ROOT/" -name "*.log" | while read -r log_file; do
              echo "$log_file:"
              echo "======"
              cat "$log_file"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build Reuter IT Networks client
        shell: powershell
        run: |
          if ($env:ENABLE_HWCODEC -eq "true") {
            python .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          } else {
            python .\build.py --portable --flutter --skip-portable-pack
          }
          Move-Item .\flutter\build\windows\x64\runner\Release .\rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          Move-Item -Force .\usbmmidd_v2 .\rustdesk

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res="$(find . -name Runner.res | head -n 1)"
          if [ -n "$runner_res" ]; then
            cp "$runner_res" ./libs/portable/Runner.res
          fi

      - name: Download topmost window artifact
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts
          path: ./rustdesk

      - name: Build installer executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./dist
          mv ./target/release/rustdesk-portable-packer.exe "./dist/${{ env.INSTALLER_NAME }}"
          cp "./dist/${{ env.INSTALLER_NAME }}" "./dist/${{ env.PORTABLE_NAME }}"
          sha256sum "./dist/${{ env.INSTALLER_NAME }}" > "./dist/${{ env.INSTALLER_NAME }}.sha256"
          sha256sum "./dist/${{ env.PORTABLE_NAME }}" > "./dist/${{ env.PORTABLE_NAME }}.sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReuterITNetworks-windows-installer
          path: |
            dist/${{ env.INSTALLER_NAME }}
            dist/${{ env.INSTALLER_NAME }}.sha256
            dist/${{ env.PORTABLE_NAME }}
            dist/${{ env.PORTABLE_NAME }}.sha256

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reuter-windows-latest
          name: Reuter IT Networks Windows Installer
          draft: true
          prerelease: true
          files: |
            dist/${{ env.INSTALLER_NAME }}
            dist/${{ env.INSTALLER_NAME }}.sha256
            dist/${{ env.PORTABLE_NAME }}
            dist/${{ env.PORTABLE_NAME }}.sha256
